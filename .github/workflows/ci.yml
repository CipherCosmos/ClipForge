name: CI

on:
  push:
    branches: [main, production-grade]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clipforge
          POSTGRES_PASSWORD: clipforge_pass
          POSTGRES_DB: clipforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://clipforge:clipforge_pass@localhost:5432/clipforge_test
      DATABASE_URL_SYNC: postgresql://clipforge:clipforge_pass@localhost:5432/clipforge_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret
      JWT_ALGORITHM: HS256
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: clipforge-test
      MINIO_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: |
          pip install -r requirements.txt
      - run: |
          pip install ruff
          ruff check app/ tests/ scripts/ --exit-zero
      - run: |
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://clipforge:clipforge_pass@localhost:5432/clipforge_test
          DATABASE_URL_SYNC: postgresql://clipforge:clipforge_pass@localhost:5432/clipforge_test
      - run: |
          python -m pytest tests/ -v

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
